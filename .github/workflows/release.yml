name: Release

on:
  push:
    tags:
      - 'v*'

# Default the whole workflow to a read-only token. The one step that needs to
# write (creating the GitHub release) gets its own job with an elevated token,
# so the long build/test job never runs third-party code next to a write token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    name: Build & Verify

    # Without this, a hanging step burns the 6h default job timeout before
    # anyone finds out the release failed.
    timeout-minutes: 30

    outputs:
      exists: ${{ steps.check_release.outputs.exists }}

    steps:
      - name: Checkout code
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Don't leave the job token in .git/config for later steps that run
          # freshly resolved third-party code.
          persist-credentials: false

      - name: Check if release already exists
        id: check_release
        run: |
          # Check if a release already exists for this tag (read-only).
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Release for ${{ github.ref_name }} already exists. Skipping release creation."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No existing release found for ${{ github.ref_name }}. Proceeding with release creation."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        if: steps.check_release.outputs.exists == 'false'
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: 8.4
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick

      - name: Install dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: composer install --prefer-dist --no-progress

      - name: Create temporary .env file
        if: steps.check_release.outputs.exists == 'false'
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env

      # Deliberately NOT --parallel: the suite is not parallel-safe, because
      # Statamic's AddonTestCase points every Stache store at one shared
      # tests/__fixtures__ directory that workers then delete out from under
      # each other. This mirrors the Tests workflow that gates pull requests.
      - name: Run tests
        if: steps.check_release.outputs.exists == 'false'
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: sqlite

      - name: Check code formatting
        if: steps.check_release.outputs.exists == 'false'
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        if: steps.check_release.outputs.exists == 'false'
        run: ./vendor/bin/phpstan analyse --memory-limit=1G

      - name: Generate changelog
        if: steps.check_release.outputs.exists == 'false'
        id: changelog
        run: |
          # CHANGELOG.md headings carry no "v" prefix (## [2.8.0]), the tag does (v2.8.0).
          version="${GITHUB_REF_NAME#v}"

          if [ -f CHANGELOG.md ]; then
            awk -v version="$version" '
              /^## \[/ { if (found) exit; if (index($0, "[" version "]")) found = 1; next }
              found
            ' CHANGELOG.md > release_notes.txt
          fi

          # Never publish an empty release body.
          if [ ! -s release_notes.txt ]; then
            echo "Automated release for ${GITHUB_REF_NAME}" > release_notes.txt
          fi

      - name: Upload release notes
        if: steps.check_release.outputs.exists == 'false'
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-notes
          path: release_notes.txt
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    name: Create Release
    needs: build
    if: needs.build.outputs.exists == 'false'
    timeout-minutes: 10

    # Only this job may write — and it runs no third-party build code, just
    # the release creation against notes produced by the build job.
    permissions:
      contents: write

    steps:
      - name: Download release notes
        # actions/download-artifact@v4.3.0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-notes

      - name: Create Release
        run: |
          gh release create ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release_notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
