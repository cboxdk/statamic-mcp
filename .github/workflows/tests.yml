name: Tests

on:
  push:
    branches: [main, develop, sd/release/v4]
  pull_request:
    branches: [main, develop, sd/release/v4]

# A push and its pull-request event verify the same branch, so they share a
# group and the newest run wins. Pushes to main get a group per commit and are
# never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || (github.ref_name == 'main' && github.sha) || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

# This workflow only reads the repo and reports status; it never needs a
# write-scoped token.
permissions:
  contents: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Code Quality

    steps:
      - name: Checkout code
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl

      - name: Cache Composer packages
        # actions/cache@v4.3.0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor
          key: ${{ runner.os }}-php-quality-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-quality-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check dependency licenses
        run: composer license-check

      # composer.lock is gitignored (this is a library, so dependencies float),
      # which means a freshly resolved lock legitimately differs from the
      # committed snapshot. Drift-checking it would fail whenever any transitive
      # dependency publishes. Verify the generator runs and emits valid
      # CycloneDX instead; the committed sbom.json is refreshed at release time.
      - name: Verify the SBOM generator produces valid CycloneDX
        run: |
          composer sbom
          php -r '$s = json_decode(file_get_contents("sbom.json"), true, 512, JSON_THROW_ON_ERROR);
                  if (($s["bomFormat"] ?? null) !== "CycloneDX" || ($s["specVersion"] ?? null) !== "1.5" || ($s["components"] ?? []) === []) {
                      fwrite(STDERR, "sbom.json is not a valid CycloneDX 1.5 document with components\n");
                      exit(1);
                  }
                  printf("SBOM valid: %d components\n", count($s["components"]));'

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --no-dev

      # Commercial addons are separately licensed optional integrations, not
      # part of the distributed dependency tree checked above.
      - name: Install optional integration types for static analysis
        run: composer require --dev 'statamic/seo-pro:7.16.0' 'statamic/forms-pro:1.0.1' 'cboxdk/laravel-relay-client:^0.2.3' 'cboxdk/laravel-id-client:^0.19.8' -W --no-interaction --no-progress

      - name: Check code formatting
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --error-format=github --memory-limit=2G

  test-sqlite:
    runs-on: ubuntu-latest
    # The V4 suite takes 14-30 min on a busy runner; 30 cut green runs off.
    timeout-minutes: 45
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # composer.json claims Laravel 12 and 13 via testbench ^10||^11;
        # both are exercised so the claim stays honest. Testbench 10 and
        # Laravel 12 both allow php ^8.2, so the full grid is valid.
        testbench: ['^10.0', '^11.0']
        statamic: ['^6.44']
        include:
          - php: '8.3'
            testbench: '^10.0'
            statamic: '6.44.0'
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.testbench == '^10.0' && '12' || '13' }} - SQLite - Statamic ${{ matrix.statamic }}

    steps:
      - name: Checkout code
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl

      - name: Cache Composer packages
        # actions/cache@v4.3.0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer require --no-update "statamic/cms:${{ matrix.statamic }}"
          composer update --prefer-dist --no-progress

      - name: Create temporary .env file
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env

      - name: Execute tests via Pest
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: sqlite

  test-mysql:
    runs-on: ubuntu-latest
    # The V4 suite takes 14-30 min on a busy runner; 30 cut green runs off.
    timeout-minutes: 45
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        testbench: ['^10.0', '^11.0']
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.testbench == '^10.0' && '12' || '13' }} - MySQL

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, pdo_sqlite, bcmath, intl

      - name: Cache Composer packages
        # actions/cache@v4.3.0
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-progress

      - name: Create temporary .env file
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env

      - name: Execute tests via Pest
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password

  test-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        testbench: ['^10.0', '^11.0']
    name: PHP 8.4 - Laravel ${{ matrix.testbench == '^10.0' && '12' || '13' }} - PostgreSQL

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mcp_test
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: mcp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U mcp_test -d mcp_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, pdo_sqlite, bcmath, intl
      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-progress
      - name: Create temporary .env file
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env
      - name: Execute tests including independent-process races and crashes
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: mcp_test
          DB_USERNAME: mcp_test
          DB_PASSWORD: disposable

  lowest:
    # composer.json promises Statamic 6.44, laravel/mcp 1.3 and Symfony 7.
    # Only --prefer-lowest resolves them together; the locked matrix never does.
    name: PHP 8.3 - lowest dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: code-quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
      - name: Install the lowest allowed dependencies
        run: composer update --prefer-lowest --prefer-stable --prefer-dist --no-progress --no-interaction
      - name: Show the resolved versions
        run: composer show | grep -E '^(statamic/cms|laravel/framework|laravel/mcp|symfony/process) '
      - name: Create temporary .env file
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env
      - name: Execute tests via Pest
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: sqlite

  forms-pro:
    name: Forms Pro integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
      - name: Install optional Forms Pro integration
        run: composer require --dev 'statamic/forms-pro:1.0.1' -W --no-interaction --no-progress
      - name: Test Forms Pro and core Forms together
        run: vendor/bin/pest tests/Integration/FormsProTest.php tests/Feature/FormsRouterTest.php

  seo-pro:
    name: SEO Pro integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
      - name: Install optional SEO Pro integration
        run: composer require --dev 'statamic/seo-pro:7.16.0' 'statamic/eloquent-driver:5.14.0' -W --no-interaction --no-progress
      - name: Test SEO Pro fields, defaults and file/database redirects
        run: vendor/bin/pest tests/Feature/Routers/SeoProWritesTest.php tests/Integration/SeoProTest.php

  eloquent-driver:
    name: Eloquent driver integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
      - name: Install optional Eloquent driver
        run: composer require --dev 'statamic/eloquent-driver:5.14.0' -W --no-interaction --no-progress
      - name: Test built-in writes on the database repositories
        run: vendor/bin/pest tests/Integration/EloquentDriverTest.php

  cbox-integrations:
    name: Cbox Relay and Cbox ID approval channels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl
      - name: Install the Cbox clients
        run: composer require --dev 'cboxdk/laravel-relay-client:^0.2.3' 'cboxdk/laravel-id-client:^0.19.8' -W --no-interaction --no-progress
      - name: Test approvals with Cbox Relay and Cbox ID
        run: vendor/bin/pest tests/Feature/Approvals
