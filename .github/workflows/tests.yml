name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-quality-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-php-quality-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code formatting
        run: ./vendor/bin/pint --test

      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --error-format=github --memory-limit=2G

      - name: Check dependency licenses
        run: composer license-check

      # composer.lock is gitignored (this is a library, so dependencies float),
      # which means a freshly resolved lock legitimately differs from the
      # committed snapshot. Drift-checking it would fail whenever any transitive
      # dependency publishes. Verify the generator runs and emits valid
      # CycloneDX instead; the committed sbom.json is refreshed at release time.
      - name: Verify the SBOM generator produces valid CycloneDX
        run: |
          composer sbom
          php -r '$s = json_decode(file_get_contents("sbom.json"), true, 512, JSON_THROW_ON_ERROR);
                  if (($s["bomFormat"] ?? null) !== "CycloneDX" || ($s["specVersion"] ?? null) !== "1.5" || ($s["components"] ?? []) === []) {
                      fwrite(STDERR, "sbom.json is not a valid CycloneDX 1.5 document with components\n");
                      exit(1);
                  }
                  printf("SBOM valid: %d components\n", count($s["components"]));'

      - name: Audit dependencies for known vulnerabilities
        run: composer audit --no-dev

  test-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        # composer.json claims Laravel 12 and 13 via testbench ^10||^11;
        # both are exercised so the claim stays honest. Testbench 10 and
        # Laravel 12 both allow php ^8.2, so the full grid is valid.
        testbench: ['^10.0', '^11.0']
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.testbench == '^10.0' && '12' || '13' }} - SQLite

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-progress

      - name: Create temporary .env file
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env

      - name: Execute tests via Pest
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: sqlite

  test-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: code-quality
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        testbench: ['^10.0', '^11.0']
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.testbench == '^10.0' && '12' || '13' }} - MySQL

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, pdo_sqlite, bcmath, intl

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-tb${{ matrix.testbench }}-

      - name: Install dependencies
        run: |
          composer require --dev --no-update "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-progress

      - name: Create temporary .env file
        run: echo "APP_KEY=base64:SGk1bGF2ZWw=" > .env

      - name: Execute tests via Pest
        run: ./vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: testing
          DB_USERNAME: root
          DB_PASSWORD: password
